<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EQ Legends — Multi-Class Spell Comparison</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1118;
    --panel: #151b24;
    --border: #4b4a2f;
    --gold: #d8ca72;
    --text: #e2e2cf;
    --muted: #9aa0ad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, serif;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 1px;
    color: var(--gold);
    margin: 0 0 4px;
  }
  .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: end;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 16px 20px;
    margin-bottom: 24px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  select, input {
    background: #0d1118;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 8px;
    font-family: inherit;
    font-size: 14px;
  }
  input[type="number"] { width: 80px; }
  h3 {
    color: var(--gold);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    font-size: 18px;
  }
  .category-desc { color: var(--muted); font-size: 13px; font-weight: normal; }
  .spell-card-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .spell-card {
    flex: 1 1 260px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 14px;
  }
  .spell-card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .class-name { color: var(--gold); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .spell-name { font-size: 16px; font-weight: bold; }
  .spell-level { color: var(--muted); font-size: 12px; }
  .spell-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .spell-stats label { display: block; font-size: 10px; }
  .spell-stats span { color: var(--text); }
  .spell-desc { color: var(--muted); font-size: 12px; font-style: italic; }
  .empty { color: var(--muted); }
  .unique-block { margin-top: 16px; color: var(--muted); font-size: 13px; }
  .unique-block summary { cursor: pointer; color: var(--gold); }
  .unique-block ul { margin: 8px 0 0; padding-left: 20px; }
</style>
</head>
<body>
  <h1>EQ Legends — Multi-Class Spell Comparison</h1>
  <p class="subtitle">
    Pick up to 3 classes and a level to see which class's version of each spell effect
    (heal, HoT, buff, etc.) is best right now — by mana efficiency and by raw power.
    Data sourced from <span>eqlwiki.com</span>.
  </p>

  <div class="controls">
    <div class="field">
      <label for="class1">Class 1</label>
      <select id="class1"></select>
    </div>
    <div class="field">
      <label for="class2">Class 2</label>
      <select id="class2"></select>
    </div>
    <div class="field">
      <label for="class3">Class 3</label>
      <select id="class3"></select>
    </div>
    <div class="field">
      <label for="level">Level</label>
      <input type="number" id="level" min="1" max="50" value="20">
    </div>
  </div>

  <div id="results"></div>

  <script src="data.js"></script>
  <script src="compare.js"></script>
  <script src="app.js"></script>
</body>
</html>
